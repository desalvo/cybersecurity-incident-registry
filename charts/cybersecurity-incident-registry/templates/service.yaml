apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cir.fullname" . }}
  labels:
    {{- include "cir.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cir.fullname" . }}
  labels:
    {{- include "cir.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cir.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

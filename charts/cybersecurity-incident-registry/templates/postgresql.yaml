{{- if eq .Values.database.mode "internal" }}
{{- $pg := .Values.database.internal }}
{{- if not $pg.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cir.pgClaim" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cir.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $pg.persistence.storageClass }}
  storageClassName: {{ $pg.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pg.persistence.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cir.fullname" . }}-postgres
  labels:
    {{- include "cir.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cir.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cir.fullname" . }}-postgres
  labels:
    {{- include "cir.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cir.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "cir.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "cir.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: {{ include "cir.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $pg.terminationGracePeriod }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
        {{- if eq .Values.platform "kubernetes" }}
        runAsUser: {{ $pg.kubernetesSecurity.runAsUser }}
        runAsGroup: {{ $pg.kubernetesSecurity.runAsGroup }}
        fsGroup: {{ $pg.kubernetesSecurity.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ printf "%s@%s" $pg.image.repository $pg.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "cir.containerSecurity" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ $pg.existingSecret | quote }}, key: {{ $pg.secretKeys.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $pg.existingSecret | quote }}, key: {{ $pg.secretKeys.password | quote }}}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: {{ $pg.existingSecret | quote }}, key: {{ $pg.secretKeys.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - {name: PGCTLTIMEOUT, value: {{ $pg.pgCtlTimeout | quote }}}
          # -h selects TCP. The official entrypoint temporary init server is socket-only.
          startupProbe:
            exec:
              command: [sh, -ec, 'exec pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ $pg.startupFailureThreshold }}
          readinessProbe:
            exec:
              command: [sh, -ec, 'exec pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -ec, 'exec pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cir.pgClaim" . }}
        - name: run
          emptyDir: {sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
{{- end }}

{
  "apiVersion": "template.openshift.io/v1",
  "kind": "Template",
  "metadata": {
    "name": "cybersecurity-incident-registry",
    "annotations": {
      "openshift.io/display-name": "Cybersecurity Incident Registry 0.10.0-1",
      "description": "Install CIR using an approved immutable image, an existing Secret and external PostgreSQL. Uses restricted-v2 compatible security and persistent /data.",
      "tags": "cybersecurity,incident-registry",
      "openshift.io/provider-display-name": "CIR project"
    }
  },
  "message": "Open the HTTPS Route. PostgreSQL credentials and CIR secrets must already exist in ${EXISTING_SECRET}. No users, databases or credentials are generated by this template.",
  "parameters": [
    {
      "name": "NAME",
      "displayName": "Release name",
      "value": "cir",
      "description": "DNS label for this installation",
      "required": true
    },
    {
      "name": "IMAGE_REPOSITORY",
      "displayName": "Image repository",
      "value": "desalvo/cybersecurity-incident-registry",
      "description": "Repository of the image approved by both production gates",
      "required": true
    },
    {
      "name": "IMAGE_SHA256",
      "displayName": "Approved OCI index SHA-256",
      "value": "",
      "description": "64 lowercase hexadecimal characters from the approved immutable index, without sha256:. PENDING_HOTFIX_REBUILD cannot be installed.",
      "required": true
    },
    {
      "name": "EXISTING_SECRET",
      "displayName": "Existing CIR Secret",
      "value": "",
      "description": "Pre-create database-url (PostgreSQL), secret-key, admin-initial-password, setting-encryption-key in this project. Do not enter secret values here.",
      "required": true
    },
    {
      "name": "VOLUME_SIZE",
      "displayName": "Data volume size",
      "value": "20Gi",
      "description": "Persistent /data size; default StorageClass must support fsGroup",
      "required": true
    },
    {
      "name": "ROUTE_HOST",
      "displayName": "HTTPS hostname",
      "value": "",
      "description": "Leave empty for an OpenShift generated hostname",
      "required": false
    },
    {
      "name": "TRUSTED_PROXY_CIDRS",
      "displayName": "Trusted proxy CIDRs",
      "value": "",
      "description": "Comma-separated actual router networks; never 0.0.0.0/0",
      "required": false
    }
  ],
  "objects": [
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "${NAME}",
        "labels": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        }
      },
      "automountServiceAccountToken": false
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "${NAME}-data",
        "labels": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "${VOLUME_SIZE}"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "${NAME}",
        "labels": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "cybersecurity-incident-registry",
            "app.kubernetes.io/instance": "${NAME}",
            "app.kubernetes.io/component": "web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "cybersecurity-incident-registry",
              "app.kubernetes.io/instance": "${NAME}",
              "app.kubernetes.io/component": "web"
            }
          },
          "spec": {
            "serviceAccountName": "${NAME}",
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 1800,
            "securityContext": {
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "web",
                "image": "${IMAGE_REPOSITORY}@sha256:${IMAGE_SHA256}",
                "imagePullPolicy": "IfNotPresent",
                "securityContext": {
                  "runAsNonRoot": true,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "seccompProfile": {
                    "type": "RuntimeDefault"
                  }
                },
                "command": [
                  "/bin/sh",
                  "-ec"
                ],
                "args": [
                  "case \"$DATABASE_URL\" in postgresql://*|postgresql+psycopg2://*) ;; *) echo \"CIR requires a PostgreSQL DATABASE_URL\" >&2; exit 1 ;; esac\nmkdir -p /tmp/cir-home\nexec /app/docker-entrypoint.sh"
                ],
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8000
                  }
                ],
                "env": [
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "${EXISTING_SECRET}",
                        "key": "database-url"
                      }
                    }
                  },
                  {
                    "name": "SECRET_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "${EXISTING_SECRET}",
                        "key": "secret-key"
                      }
                    }
                  },
                  {
                    "name": "ADMIN_INITIAL_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "${EXISTING_SECRET}",
                        "key": "admin-initial-password"
                      }
                    }
                  },
                  {
                    "name": "SETTING_ENCRYPTION_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "${EXISTING_SECRET}",
                        "key": "setting-encryption-key"
                      }
                    }
                  },
                  {
                    "name": "CIR_PRODUCTION",
                    "value": "1"
                  },
                  {
                    "name": "CIR_DISABLE_CSRF",
                    "value": "0"
                  },
                  {
                    "name": "SESSION_COOKIE_SECURE",
                    "value": "1"
                  },
                  {
                    "name": "CIR_FORCE_HSTS",
                    "value": "1"
                  },
                  {
                    "name": "CIR_RUN_AS_ROOT_ON_VOLUME_PERMISSION_FAILURE",
                    "value": "0"
                  },
                  {
                    "name": "HOME",
                    "value": "/tmp/cir-home"
                  },
                  {
                    "name": "PORT",
                    "value": "8000"
                  },
                  {
                    "name": "SSL_ENABLED",
                    "value": "0"
                  },
                  {
                    "name": "UPLOAD_DIR",
                    "value": "/data/uploads"
                  },
                  {
                    "name": "LOGO_DIR",
                    "value": "/data/logo"
                  },
                  {
                    "name": "FORM_TEMPLATE_DIR",
                    "value": "/data/form_templates"
                  },
                  {
                    "name": "SSO_LOGO_DIR",
                    "value": "/data/sso_logos"
                  },
                  {
                    "name": "SSL_DIR",
                    "value": "/data/ssl"
                  },
                  {
                    "name": "BACKUP_DIR",
                    "value": "/data/backups"
                  },
                  {
                    "name": "AI_CHATBOT_DOC_DIR",
                    "value": "/data/ai_chatbot_docs"
                  },
                  {
                    "name": "WEB_CONCURRENCY",
                    "value": "1"
                  },
                  {
                    "name": "GUNICORN_THREADS",
                    "value": "4"
                  },
                  {
                    "name": "GUNICORN_TIMEOUT",
                    "value": "1800"
                  },
                  {
                    "name": "GUNICORN_GRACEFUL_TIMEOUT",
                    "value": "1800"
                  },
                  {
                    "name": "CIR_TRUSTED_PROXY_CIDRS",
                    "value": "${TRUSTED_PROXY_CIDRS}"
                  }
                ],
                "startupProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5,
                  "failureThreshold": 120
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": "http"
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": "http"
                  },
                  "periodSeconds": 20,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "512Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "2Gi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data"
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "${NAME}-data"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {
                  "sizeLimit": "1Gi"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "${NAME}",
        "labels": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        }
      },
      "spec": {
        "type": "ClusterIP",
        "selector": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        },
        "ports": [
          {
            "name": "http",
            "port": 80,
            "targetPort": "http"
          }
        ]
      }
    },
    {
      "apiVersion": "route.openshift.io/v1",
      "kind": "Route",
      "metadata": {
        "name": "${NAME}",
        "labels": {
          "app.kubernetes.io/name": "cybersecurity-incident-registry",
          "app.kubernetes.io/instance": "${NAME}",
          "app.kubernetes.io/component": "web"
        },
        "annotations": {
          "haproxy.router.openshift.io/timeout": "1800s"
        }
      },
      "spec": {
        "host": "${ROUTE_HOST}",
        "to": {
          "kind": "Service",
          "name": "${NAME}"
        },
        "port": {
          "targetPort": "http"
        },
        "tls": {
          "termination": "edge",
          "insecureEdgeTerminationPolicy": "Redirect"
        }
      }
    }
  ]
}

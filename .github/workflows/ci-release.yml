name: CIR CI and Docker release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cir-ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  DEFAULT_DOCKER_REPOSITORY: desalvo/cybersecurity-incident-registry

jobs:
  ci-mode:
    name: Select full CI or temporary security-only mode
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      security_only: ${{ steps.mode.outputs.security_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Determine mode from exact head commit
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo 'security_only=false' >> "$GITHUB_OUTPUT"
          # Never bypass full CI for main, tags or explicit manual releases.
          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != push ]]; then exit 0; fi
          if [[ "$REF_NAME" == refs/heads/main || "$REF_NAME" == refs/tags/* ]]; then exit 0; fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
          message="$(git show -s --format=%B "$HEAD_SHA")"
          if [[ "$message" == *'[ci-security]'* ]]; then
            echo 'security_only=true' >> "$GITHUB_OUTPUT"
            echo 'Security-only request detected; full tests and documentation are skipped for this non-main ref.' >> "$GITHUB_STEP_SUMMARY"
          fi

  release-metadata:
    name: Resolve release metadata
    needs: [ci-mode]
    if: needs.ci-mode.outputs.security_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
      - name: Set up Python for release identity
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve one automatic build for this workflow
        id: metadata
        run: python scripts/prepare_release_metadata.py --github-output "$GITHUB_OUTPUT"

  quality-gates:
    name: Tests, PostgreSQL, SCA and offline gates
    needs: [ci-mode, release-metadata]
    if: needs.ci-mode.outputs.security_only != 'true'
    env:
      CIR_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      CIR_RELEASE_BUILD: ${{ needs.release-metadata.outputs.build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt

      - name: Stamp the workflow release identity
        run: python scripts/prepare_release_metadata.py --build "$CIR_RELEASE_BUILD" --expected-version "$CIR_RELEASE_VERSION" --write

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pip-audit

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Install PDF first-page renderer for documentation regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftoppm -v

      - name: Generate resolved current-release SBOM
        run: |
          mkdir -p "${RUNNER_TEMP}/cir-sbom"
          python scripts/generate_sbom.py --output "${RUNNER_TEMP}/cir-sbom/SBOM_CURRENT.cdx.json"

      - name: Upload resolved current-release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/cir-sbom/SBOM_CURRENT.cdx.json
          if-no-files-found: error
          retention-days: 30

      # GitHub's ubuntu-24.04 image includes Helm. Absence is a hard failure,
      # including on self-hosted replacement runners: never substitute source-only checks.
      - name: Verify Helm and OpenShift installation renders
        run: |
          helm version --short
          python scripts/check_installation_package.py --require-helm

      # BUILD is stamped at workflow runtime; regenerate brochures against that
      # exact identity before tests inspect their embedded metadata.
      - name: Regenerate release-stamped brochures
        run: |
          python scripts/build_brochures.py
          python scripts/audit_documentation_media.py

      - name: Run complete pytest suite
        env:
          CIR_DISABLE_BACKGROUND_SCHEDULERS: '1'
          UPLOAD_DIR: ${{ runner.temp }}/cir-pytest/uploads
          LOGO_DIR: ${{ runner.temp }}/cir-pytest/logos
          SSO_LOGO_DIR: ${{ runner.temp }}/cir-pytest/sso-logos
          FORM_TEMPLATE_DIR: ${{ runner.temp }}/cir-pytest/form-templates
          BACKUP_DIR: ${{ runner.temp }}/cir-pytest/backups
          AI_CHATBOT_DOC_DIR: ${{ runner.temp }}/cir-pytest/ai-chatbot-docs
          SSL_DIR: ${{ runner.temp }}/cir-pytest/ssl
        run: python -m pytest -q

      - name: Run real PostgreSQL test suite
        env:
          CIR_DISABLE_BACKGROUND_SCHEDULERS: '1'
          UPLOAD_DIR: ${{ runner.temp }}/cir-postgres-tests/uploads
          LOGO_DIR: ${{ runner.temp }}/cir-postgres-tests/logos
          SSO_LOGO_DIR: ${{ runner.temp }}/cir-postgres-tests/sso-logos
          FORM_TEMPLATE_DIR: ${{ runner.temp }}/cir-postgres-tests/form-templates
          BACKUP_DIR: ${{ runner.temp }}/cir-postgres-tests/backups
          AI_CHATBOT_DOC_DIR: ${{ runner.temp }}/cir-postgres-tests/ai-chatbot-docs
          SSL_DIR: ${{ runner.temp }}/cir-postgres-tests/ssl
        run: ./scripts/run_postgres_tests.sh

      - name: Verify release candidate
        run: python scripts/verify_release_candidate.py

      - name: Verify temporary security-acceptance runtime assumptions
        run: python scripts/verify_security_gate_context.py

      - name: Run software-composition analysis
        run: ./scripts/run_sca.sh

      - name: Audit public documentation build dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-docs.txt --strict

      - name: Build release package as packaging smoke test
        run: ./scripts/package_release.sh "${RUNNER_TEMP}/cybersecurity-incident-registry-${GITHUB_SHA}.zip"

      - name: Build verified Helm and OpenShift installation packages
        run: python scripts/package_installers.py --output "${RUNNER_TEMP}/cir-installers-${GITHUB_SHA}" --require-helm

      - name: Upload installation packages
        uses: actions/upload-artifact@v7
        with:
          name: installation-${{ github.sha }}
          path: ${{ runner.temp }}/cir-installers-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-${{ github.sha }}
          path: SCA_PIP_AUDIT.json
          if-no-files-found: warn
          retention-days: 30

  ui-documentation:
    name: Real UI screenshots and documentation
    needs: [ci-mode, release-metadata]
    if: needs.ci-mode.outputs.security_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CIR_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      CIR_RELEASE_BUILD: ${{ needs.release-metadata.outputs.build }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Set up Python for browser documentation
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt
            requirements-docs.txt

      - name: Stamp the workflow release identity
        run: python scripts/prepare_release_metadata.py --build "$CIR_RELEASE_BUILD" --expected-version "$CIR_RELEASE_VERSION" --write

      - name: Install application and pinned browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-ui.txt pip-audit
          python -m pip check
          python -m pip_audit -r requirements.txt -r requirements-ui.txt -r requirements-docs.txt --strict

      - name: Install exact-PDF first-page renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftoppm -v

      - name: Install matching Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Capture and test the real application interface
        run: |
          python scripts/capture_ui_screenshots.py \
            --output "${RUNNER_TEMP}/cir-ui-evidence" \
            --source-commit "${GITHUB_SHA}"

      - name: Build manuals from verified real screenshots
        run: |
          python scripts/build_documentation_pdfs.py \
            --screenshot-manifest "${RUNNER_TEMP}/cir-ui-evidence/manifest.json" \
            --output-dir "${RUNNER_TEMP}/cir-ui-evidence/documentation" \
            --require-real-screenshots \
            --include-brochures \
            --source-commit "${GITHUB_SHA}"

      - name: Audit brochure artwork provenance and all editorial pages
        run: |
          python scripts/audit_documentation_media.py \
            --docs "${RUNNER_TEMP}/cir-ui-evidence/documentation"

      - name: Build editable training presentation from this run
        run: |
          python scripts/build_training_presentation.py \
            --output "${RUNNER_TEMP}/cir-ui-evidence/documentation/CIR_Operational_Training_IT.pptx" \
            --documentation-dir "${RUNNER_TEMP}/cir-ui-evidence/documentation" \
            --screenshot-manifest "${RUNNER_TEMP}/cir-ui-evidence/manifest.json" \
            --source-commit "${GITHUB_SHA}" \
            --require-real-screenshots

      - name: Validate and seal complete documentation bundle
        run: |
          python scripts/finalize_documentation_bundle.py \
            --screenshot-manifest "${RUNNER_TEMP}/cir-ui-evidence/manifest.json" \
            --documentation-dir "${RUNNER_TEMP}/cir-ui-evidence/documentation" \
            --source-commit "${GITHUB_SHA}"

      - name: Install verified documentation and package the current source
        run: |
          python scripts/install_ui_documentation.py \
            --manifest "${RUNNER_TEMP}/cir-ui-evidence/manifest.json" \
            --documentation-dir "${RUNNER_TEMP}/cir-ui-evidence/documentation" \
            --source-commit "${GITHUB_SHA}"
          ./scripts/package_release.sh "${RUNNER_TEMP}/cir-ui-evidence/cybersecurity-incident-registry-${GITHUB_SHA}.zip"

      - name: Upload real screenshots, manuals and source package
        id: ui-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-documentation-${{ github.sha }}
          path: ${{ runner.temp }}/cir-ui-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Report screenshot and documentation evidence
        env:
          UI_ARTIFACT_URL: ${{ steps.ui-artifact.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cir-ui-evidence/manifest.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('## Real application UI and documentation\n\n')
              out.write(f"Source commit: `{data['source_commit']}`\n\n")
              out.write(f"{len(data['screenshots'])} real Chromium captures; isolated synthetic data; CSRF enabled.\n\n")
              out.write('Five manuals, two brochures, screenshot gallery, editable PowerPoint and five actual PDF first-page previews are validated as one commit/version/build-bound bundle.\n\n')
              out.write('The AI response comes from a labelled local test provider through the real application endpoint.\n\n')
              out.write(f"[Download screenshots, manuals, brochures, PowerPoint and cumulative source]({os.environ['UI_ARTIFACT_URL']})\n")
          PY

      - name: Upload failed UI capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-capture-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cir-ui-evidence/failure.json
            ${{ runner.temp }}/cir-ui-evidence/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

  release-scope:
    name: Detect production-impacting changes
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    outputs:
      production_changed: ${{ steps.diff.outputs.production_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect metadata-only production digest update
        id: diff
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          printf 'Changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          metadata_only=true
          for path in "${changed[@]}"; do
            case "$path" in
              PRODUCTION_IMAGE_DIGEST|k8s/kustomization.yaml) ;;
              *) metadata_only=false ;;
            esac
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            metadata_only=false
          fi
          if [[ "$metadata_only" == true ]]; then
            echo "production_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
          fi

  docker-release:
    name: Build, scan and promote multi-arch image
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && needs.release-scope.outputs.production_changed == 'true'))
    needs: [release-metadata, quality-gates, ui-documentation, release-scope]
    env:
      CIR_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      CIR_RELEASE_BUILD: ${{ needs.release-metadata.outputs.build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp the workflow release identity
        run: python scripts/prepare_release_metadata.py --build "$CIR_RELEASE_BUILD" --expected-version "$CIR_RELEASE_VERSION" --write

      - name: Download verified documentation from this workflow run
        uses: actions/download-artifact@v8.0.2
        with:
          name: ui-documentation-${{ github.sha }}
          path: ${{ runner.temp }}/cir-ui-evidence
          digest-mismatch: error

      - name: Install exact-source UI documentation before building
        run: |
          python scripts/install_ui_documentation.py \
            --manifest "${RUNNER_TEMP}/cir-ui-evidence/manifest.json" \
            --documentation-dir "${RUNNER_TEMP}/cir-ui-evidence/documentation" \
            --source-commit "${GITHUB_SHA}"

      - name: Resolve Docker repository and final tag
        id: image
        shell: bash
        env:
          CONFIGURED_REPOSITORY: ${{ vars.CIR_DOCKER_REPOSITORY }}
        run: |
          set -euo pipefail
          repository="${CONFIGURED_REPOSITORY:-${DEFAULT_DOCKER_REPOSITORY}}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            final_tag=latest
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            final_tag="$GITHUB_REF_NAME"
            if [[ ! "$final_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Git tag '$final_tag' is not a valid Docker tag" >&2
              exit 1
            fi
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi
          candidate_tag="ci-${GITHUB_SHA}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "final_tag=$final_tag" >> "$GITHUB_OUTPUT"
          echo "candidate_image=${repository}:${candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "final_image=${repository}:${final_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push candidate multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.image.outputs.candidate_image }}
          build-args: |
            CIR_RELEASE_BUILD=${{ needs.release-metadata.outputs.build }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.cir.build=${{ needs.release-metadata.outputs.build }}
          provenance: mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.2
          cache: true

      - name: Run CIR Trivy production gate on exact candidate digest
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bash ./scripts/run_trivy_production_gate.sh \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ github.sha }}
          path: generated/trivy-r8/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote approved digest to final Docker tag
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.final_image }}" \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

      - name: Verify published manifest and report digest
        id: published
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.final_image }}"
          candidate="${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

          docker buildx imagetools inspect "$image"

          inspect_manifest_json() {
            local ref="$1"
            local output="$2"
            local label="$3"
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "Structured manifest inspection ($label), attempt ${attempt}/5: $ref"
              if docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' > "$output"; then
                python -m json.tool "$output" >/dev/null
                return 0
              fi
              rc=$?
              echo "Structured manifest inspection failed for $label (rc=$rc)" >&2
              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 2))
              fi
            done
            echo "Unable to obtain structured OCI manifest for $label after 5 attempts" >&2
            return 1
          }

          # Use Buildx structured Manifest output instead of --raw.  Besides being
          # parseable JSON, it carries the resolved top-level digest and avoids
          # relying on the human-readable formatter/awk combination.  Registry
          # propagation immediately after retagging can be briefly eventually
          # consistent, so retry a bounded number of times and fail closed.
          inspect_manifest_json "$candidate" "${RUNNER_TEMP}/candidate-index.json" candidate
          inspect_manifest_json "$image" "${RUNNER_TEMP}/published-index.json" published

          digest="$(python -c 'import json,re,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); digest=payload.get("digest", ""); (isinstance(digest, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", digest)) or sys.exit(f"Unable to resolve immutable manifest digest from structured OCI manifest: {digest!r}"); print(digest)' "${RUNNER_TEMP}/published-index.json")"

          # The top-level index digest may change during registry-side retagging.
          # Fail closed unless every immutable child descriptor (platform images
          # and attestations) is exactly the one that passed the Trivy gate.
          python scripts/verify_promoted_manifest.py \
            "${RUNNER_TEMP}/candidate-index.json" \
            "${RUNNER_TEMP}/published-index.json"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## CIR Docker release"
            echo
            echo "- Image: \`$image\`"
            echo "- Digest: \`$digest\`"
            echo "- Version: \`$CIR_RELEASE_VERSION\`"
            echo "- Build: \`$CIR_RELEASE_BUILD\` (Europe/Rome)"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
            echo "- Platform manifest equivalence: PASS"
            echo "- Trivy gate: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open production digest metadata pull request
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/record_production_digest.py \
            --repository "${{ steps.image.outputs.repository }}" \
            --digest "${{ steps.published.outputs.digest }}"
          ./scripts/verify_production_release.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION_IMAGE_DIGEST k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production digest metadata already up to date."
            exit 0
          fi

          short_digest="${{ steps.published.outputs.digest }}"
          short_digest="${short_digest#sha256:}"
          branch="automation/production-digest-${short_digest:0:16}"
          git checkout -b "$branch"
          git commit -m "chore: record promoted production OCI digest"
          git push origin "HEAD:$branch"

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: record promoted production OCI digest" \
              --body "Records the immutable OCI digest already promoted to production after all CIR quality, PostgreSQL, SCA and Trivy gates passed. This PR changes only production digest metadata and must not rebuild the production image."
          else
            echo "Production digest PR already open: #$existing"
          fi

          # Pushes/PRs created with GITHUB_TOKEN do not recursively trigger this
          # workflow. Explicitly dispatch the quality gates on the metadata branch
          # so protected-main required checks can complete without rebuilding Docker.
          gh workflow run ci-release.yml --ref "$branch"

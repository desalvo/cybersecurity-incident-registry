name: CIR CI and Docker release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cir-ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  DEFAULT_DOCKER_REPOSITORY: desalvo/cybersecurity-incident-registry

jobs:
  quality-gates:
    name: Tests, PostgreSQL, SCA and offline gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pip-audit

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Run complete pytest suite
        env:
          CIR_DISABLE_BACKGROUND_SCHEDULERS: '1'
          UPLOAD_DIR: ${{ runner.temp }}/cir-pytest/uploads
          LOGO_DIR: ${{ runner.temp }}/cir-pytest/logos
          SSO_LOGO_DIR: ${{ runner.temp }}/cir-pytest/sso-logos
          FORM_TEMPLATE_DIR: ${{ runner.temp }}/cir-pytest/form-templates
          BACKUP_DIR: ${{ runner.temp }}/cir-pytest/backups
          AI_CHATBOT_DOC_DIR: ${{ runner.temp }}/cir-pytest/ai-chatbot-docs
          SSL_DIR: ${{ runner.temp }}/cir-pytest/ssl
        run: python -m pytest -q

      - name: Run real PostgreSQL test suite
        env:
          CIR_DISABLE_BACKGROUND_SCHEDULERS: '1'
          UPLOAD_DIR: ${{ runner.temp }}/cir-postgres-tests/uploads
          LOGO_DIR: ${{ runner.temp }}/cir-postgres-tests/logos
          SSO_LOGO_DIR: ${{ runner.temp }}/cir-postgres-tests/sso-logos
          FORM_TEMPLATE_DIR: ${{ runner.temp }}/cir-postgres-tests/form-templates
          BACKUP_DIR: ${{ runner.temp }}/cir-postgres-tests/backups
          AI_CHATBOT_DOC_DIR: ${{ runner.temp }}/cir-postgres-tests/ai-chatbot-docs
          SSL_DIR: ${{ runner.temp }}/cir-postgres-tests/ssl
        run: ./scripts/run_postgres_tests.sh

      - name: Verify release candidate
        run: python scripts/verify_release_candidate.py

      - name: Verify temporary security-acceptance runtime assumptions
        run: python scripts/verify_security_gate_context.py

      - name: Run software-composition analysis
        run: ./scripts/run_sca.sh

      - name: Build release package as packaging smoke test
        run: ./scripts/package_release.sh "${RUNNER_TEMP}/cybersecurity-incident-registry-${GITHUB_SHA}.zip"

      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-${{ github.sha }}
          path: SCA_PIP_AUDIT.json
          if-no-files-found: warn
          retention-days: 30

  release-scope:
    name: Detect production-impacting changes
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    outputs:
      production_changed: ${{ steps.diff.outputs.production_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect metadata-only production digest update
        id: diff
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          printf 'Changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          metadata_only=true
          for path in "${changed[@]}"; do
            case "$path" in
              PRODUCTION_IMAGE_DIGEST|k8s/kustomization.yaml) ;;
              *) metadata_only=false ;;
            esac
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            metadata_only=false
          fi
          if [[ "$metadata_only" == true ]]; then
            echo "production_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "production_changed=true" >> "$GITHUB_OUTPUT"
          fi

  docker-release:
    name: Build, scan and promote multi-arch image
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && needs.release-scope.outputs.production_changed == 'true'))
    needs: [quality-gates, release-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Docker repository and final tag
        id: image
        shell: bash
        env:
          CONFIGURED_REPOSITORY: ${{ vars.CIR_DOCKER_REPOSITORY }}
        run: |
          set -euo pipefail
          repository="${CONFIGURED_REPOSITORY:-${DEFAULT_DOCKER_REPOSITORY}}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            final_tag=latest
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            final_tag="$GITHUB_REF_NAME"
            if [[ ! "$final_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Git tag '$final_tag' is not a valid Docker tag" >&2
              exit 1
            fi
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi
          candidate_tag="ci-${GITHUB_SHA}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "final_tag=$final_tag" >> "$GITHUB_OUTPUT"
          echo "candidate_image=${repository}:${candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "final_image=${repository}:${final_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push candidate multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.image.outputs.candidate_image }}
          provenance: mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true

      - name: Run CIR Trivy production gate on exact candidate digest
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./scripts/run_trivy_production_gate.sh \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.sha }}
          path: generated/trivy-r8/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote approved digest to final Docker tag
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.final_image }}" \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

      - name: Verify published manifest and report digest
        id: published
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.final_image }}"
          candidate="${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

          docker buildx imagetools inspect "$image"
          digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable manifest digest for $image" >&2
            exit 1
          fi

          # The top-level index digest may change during registry-side retagging.
          # Fail closed unless every immutable child descriptor (platform images
          # and attestations) is exactly the one that passed the Trivy gate.
          docker buildx imagetools inspect --raw "$candidate" > "${RUNNER_TEMP}/candidate-index.json"
          docker buildx imagetools inspect --raw "$image" > "${RUNNER_TEMP}/published-index.json"
          python scripts/verify_promoted_manifest.py \
            "${RUNNER_TEMP}/candidate-index.json" \
            "${RUNNER_TEMP}/published-index.json"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## CIR Docker release"
            echo
            echo "- Image: \`$image\`"
            echo "- Digest: \`$digest\`"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
            echo "- Platform manifest equivalence: PASS"
            echo "- Trivy gate: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open production digest metadata pull request
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/record_production_digest.py \
            --repository "${{ steps.image.outputs.repository }}" \
            --digest "${{ steps.published.outputs.digest }}"
          ./scripts/verify_production_release.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION_IMAGE_DIGEST k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production digest metadata already up to date."
            exit 0
          fi

          short_digest="${{ steps.published.outputs.digest }}"
          short_digest="${short_digest#sha256:}"
          branch="automation/production-digest-${short_digest:0:16}"
          git checkout -b "$branch"
          git commit -m "chore: record promoted production OCI digest"
          git push origin "HEAD:$branch"

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: record promoted production OCI digest" \
              --body "Records the immutable OCI digest already promoted to production after all CIR quality, PostgreSQL, SCA and Trivy gates passed. This PR changes only production digest metadata and must not rebuild the production image."
          else
            echo "Production digest PR already open: #$existing"
          fi

          # Pushes/PRs created with GITHUB_TOKEN do not recursively trigger this
          # workflow. Explicitly dispatch the quality gates on the metadata branch
          # so protected-main required checks can complete without rebuilding Docker.
          gh workflow run ci-release.yml --ref "$branch"

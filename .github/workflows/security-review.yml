name: CIR periodic security review

on:
  schedule:
    # Monday 06:15 UTC; GitHub may delay scheduled jobs during high load.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cir-security-review-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  dependencies:
    name: Review current Python dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main review source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact application requirements and audit tooling
        run: |
          python -m pip install -r requirements.txt pip-audit
          python -m pip check
      - name: Audit current requirements
        run: ./scripts/run_sca.sh
      - name: Retain dependency review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periodic-sca-${{ github.run_id }}-${{ github.run_attempt }}
          path: SCA_PIP_AUDIT.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize dependency review
        if: always()
        env:
          REVIEW_RESULT: ${{ job.status }}
        run: |
          {
            echo '## Periodic Python dependency review'
            echo
            echo "Result: ${REVIEW_RESULT}"
            echo "Source commit: ${GITHUB_SHA}"
            echo 'This review does not publish an image or renew risk acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

  production-image:
    name: Review immutable image (${{ matrix.architecture }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    steps:
      - name: Checkout main review policy
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require recorded immutable production target
        id: target
        run: |
          python scripts/review_production_target.py \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report "${RUNNER_TEMP}/cir-security-review/target.json"
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.2
          cache: true
      - name: Review exact digest through the CIR production gate
        env:
          CIR_PRODUCTION_IMAGE: ${{ steps.target.outputs.image }}
          CIR_TRIVY_PLATFORMS: ${{ matrix.platform }}
          CIR_TRIVY_OUTPUT_DIR: ${{ runner.temp }}/cir-security-review
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash ./scripts/run_trivy_production_gate.sh "$CIR_PRODUCTION_IMAGE"
      - name: Retain platform review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periodic-trivy-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cir-security-review/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize platform review
        if: always()
        env:
          REVIEW_RESULT: ${{ job.status }}
          REVIEW_PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo '## Periodic immutable image review'
            echo
            echo "Platform: ${REVIEW_PLATFORM}"
            echo "Result: ${REVIEW_RESULT}"
            echo "Policy source commit: ${GITHUB_SHA}"
            echo 'Pending production metadata, expired acceptance, fixes, new findings and Python HIGH/CRITICAL remain blocking.'
            echo 'No image build, promotion or automatic acceptance renewal is performed.'
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify about periodic production security findings
    needs: [dependencies, production-image]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open or update actionable security issue
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          PRODUCTION_RESULT: ${{ needs.production-image.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: '[CIR security] Periodic production review requires attention'
        shell: bash
        run: |
          set -euo pipefail
          result=success
          if [[ "$DEPENDENCIES_RESULT" != success || "$PRODUCTION_RESULT" != success ]]; then
            result=failure
          fi
          python scripts/notify_security_issue.py \
            --title "$TITLE" --result "$result" --run-url "$RUN_URL" \
            --context "Dependency SCA: ${DEPENDENCIES_RESULT}; immutable production image: ${PRODUCTION_RESULT}" \
            --repository "$GITHUB_REPOSITORY"

services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_DB: cir_test
      POSTGRES_USER: cir_test
      POSTGRES_PASSWORD: cir_test_password
    ports:
      - "${CIR_POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cir_test -d cir_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

# EXAMPLE ONLY - not included by k8s/kustomization.yaml.
#
# Use this Job only when migrating an existing 0.9.0-1 deployment that used
# the former seven-PVC layout. Scale the CIR Deployment to zero first, create
# the new cir-data PVC, verify the claim names below, then apply this Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: cir-migrate-pvcs-to-data
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /data/uploads /data/logo /data/form_templates /data/sso_logos /data/ssl /data/backups /data/ai_chatbot_docs
          copy_tree() {
            src="$1"; dst="$2"
            if [ -d "$src" ]; then
              cp -a "$src"/. "$dst"/
            fi
          }
          copy_tree /old/uploads /data/uploads
          copy_tree /old/logo /data/logo
          copy_tree /old/form_templates /data/form_templates
          copy_tree /old/sso_logos /data/sso_logos
          copy_tree /old/ssl /data/ssl
          copy_tree /old/backups /data/backups
          copy_tree /old/ai_chatbot_docs /data/ai_chatbot_docs
          chown -R 10001:10001 /data
          chmod -R u+rwX,g+rwX /data
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: uploads, mountPath: /old/uploads, readOnly: true}
        - {name: logo, mountPath: /old/logo, readOnly: true}
        - {name: form-templates, mountPath: /old/form_templates, readOnly: true}
        - {name: sso-logos, mountPath: /old/sso_logos, readOnly: true}
        - {name: ssl-certs, mountPath: /old/ssl, readOnly: true}
        - {name: backups, mountPath: /old/backups, readOnly: true}
        - {name: ai-chatbot-docs, mountPath: /old/ai_chatbot_docs, readOnly: true}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: cir-data}
      - name: uploads
        persistentVolumeClaim: {claimName: cir-uploads}
      - name: logo
        persistentVolumeClaim: {claimName: cir-logo}
      - name: form-templates
        persistentVolumeClaim: {claimName: cir-form-templates}
      - name: sso-logos
        persistentVolumeClaim: {claimName: cir-sso-logos}
      - name: ssl-certs
        persistentVolumeClaim: {claimName: cir-ssl-certs}
      - name: backups
        persistentVolumeClaim: {claimName: cir-backups}
      - name: ai-chatbot-docs
        persistentVolumeClaim: {claimName: cir-ai-chatbot-docs}

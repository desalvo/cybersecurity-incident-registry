apiVersion: apps/v1
kind: Deployment
metadata: {name: cybersecurity-incident-registry}
spec:
  replicas: 2
  selector: {matchLabels: {app: cybersecurity-incident-registry}}
  template:
    metadata: {labels: {app: cybersecurity-incident-registry}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-persistent-volumes
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /data/uploads /data/logo /data/form_templates /data/sso_logos /data/ssl /data/backups /data/ai_chatbot_docs
          chown -R 10001:10001 /data
          chmod -R u+rwX,g+rwX /data
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        volumeMounts:
        - {name: data, mountPath: /data}
      containers:
      - name: web
        image: desalvo/cybersecurity-incident-registry:0.9.0-1
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - {containerPort: 8000}
        - {containerPort: 8443}
        env:
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: cir-secrets, key: database-url}}}
        - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: cir-secrets, key: secret-key}}}
        - {name: ADMIN_INITIAL_PASSWORD, valueFrom: {secretKeyRef: {name: cir-secrets, key: admin-initial-password}}}
        - {name: SETTING_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: cir-secrets, key: setting-encryption-key}}}
        - {name: APP_VERSION, value: "0.9.0-1"}
        - {name: APP_BUILD, value: "20260902"}
        - {name: CIR_PRODUCTION, value: "1"}
        - {name: SESSION_COOKIE_SECURE, value: "1"}
        - {name: CIR_DISABLE_CSRF, value: "0"}
        - {name: CIR_RUN_AS_ROOT_ON_VOLUME_PERMISSION_FAILURE, value: "0"}
        - {name: HOME, value: /tmp/cir-home}
        - {name: UPLOAD_DIR, value: /data/uploads}
        - {name: LOGO_DIR, value: /data/logo}
        - {name: FORM_TEMPLATE_DIR, value: /data/form_templates}
        - {name: SSO_LOGO_DIR, value: /data/sso_logos}
        - {name: SSL_DIR, value: /data/ssl}
        - {name: BACKUP_DIR, value: /data/backups}
        - {name: AI_CHATBOT_DOC_DIR, value: /data/ai_chatbot_docs}
        - {name: SSL_PORT, value: "8443"}
        - {name: SSL_ENABLED, value: "0"}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
        readinessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: cir-data}
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata: {name: cybersecurity-incident-registry}
spec:
  selector: {app: cybersecurity-incident-registry}
  ports:
  - {name: http, port: 80, targetPort: 8000}
  - {name: https, port: 443, targetPort: 8443}

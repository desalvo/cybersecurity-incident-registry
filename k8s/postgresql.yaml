apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cir-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cir-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cir-postgres
  template:
    metadata:
      labels:
        app: cir-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18.6
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: cir-postgres-secret
        readinessProbe:
          exec:
            command: ["sh", "-c", "exec pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "exec pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cir-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: cir-postgres
spec:
  selector:
    app: cir-postgres
  ports:
  - port: 5432
    targetPort: 5432

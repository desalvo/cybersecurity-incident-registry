apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cir-data}
spec:
  # The shipped Deployment uses two replicas, therefore the default manifest
  # requests RWX storage. If the cluster only provides RWO storage, run CIR
  # with one replica or provide an equivalent shared storage class.
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 20Gi}

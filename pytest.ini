[pytest]
addopts = -p no:cacheprovider -p no:ddtrace -p no:pytest_cov -p no:pytest_jsonreport -p no:metadata -p no:anyio -p no:asyncio -p no:faker
pythonpath = .
testpaths = tests
markers =
    postgres: requires a real PostgreSQL server configured through CIR_POSTGRES_TEST_URL
filterwarnings =
    ignore:tagMap is deprecated:DeprecationWarning:ldap3\.utils\.asn1
    ignore:typeMap is deprecated:DeprecationWarning:ldap3\.utils\.asn1
    ignore:'oneOf' deprecated:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._fontconfig_pattern
    ignore:'parseString' deprecated:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._fontconfig_pattern
    ignore:'resetCache' deprecated:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._fontconfig_pattern
    ignore:'enablePackrat' deprecated:pyparsing.exceptions.PyparsingDeprecationWarning:matplotlib\._mathtext
    error::sqlalchemy.exc.LegacyAPIWarning
